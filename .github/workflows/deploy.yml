name: 🚀 Auto Deploy to GoDaddy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🧠 Validate node setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Verify basic build before deploy
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm run build --prefix frontend
          echo "✅ Pre-deploy checks passed"

      - name: 🔐 SSH to VPS and run deploy script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GODADDY_HOST }}
          username: ${{ secrets.GODADDY_USER }}
          key: ${{ secrets.GODADDY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/paybillswithus.com
            ./deploy.sh
