name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the project directory
            cd /opt/paybillswithus.com

            # Pull the latest code
            git reset --hard
            git pull origin main

            # Install all dependencies
            echo "Installing dependencies..."
            npm install --prefix backend
            npm install --prefix frontend
            npm install --prefix admin
            npm install --prefix agent

            # Apply database migrations
            echo "Running database migrations..."
            cd /opt/paybillswithus.com/backend
            npx prisma migrate deploy

            # Build all applications
            echo "Building applications..."
            npm run build --prefix /opt/paybillswithus.com/backend
            npm run build --prefix /opt/paybillswithus.com/frontend
            npm run build --prefix /opt/paybillswithus.com/admin
            npm run build --prefix /opt/paybillswithus.com/agent

            # Restart services
            echo "Restarting services..."
            pm2 restart paybillswithus-api
            systemctl restart nginx
